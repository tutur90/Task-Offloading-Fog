policy: "NSGA2"

env:
  dataset: "Pakistan"
  flag: "Tuple30K"
  refresh_rate: 0.01

training:
  num_epochs: 30        # Number of generations for NPGA
  pop_size: 30          # Population size for NPGA
  mutation_sigma: null  # Gaussian noise std: null = auto (He std per layer = sqrt(2/fan_in))

selection:
  # Minimum acceptable quality per objective (acts as upper bound since all objectives are minimized).
  # Individuals exceeding any threshold are disqualified during selection.
  # Set to null to disable the constraint for that objective.
  # Objectives order: [ttr, latency, energy]
  min_scores: [null, null, null]

model:
  d_model: 128
  n_layers: 3
  # obs_type: ["cpu"]
  obs_type: ["cpu", "bw", "buffer"]
