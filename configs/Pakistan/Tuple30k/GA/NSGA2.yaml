policy: "NSGA2"
algo: "NSGA2" 

seed: 42

env:
  dataset: "Pakistan"
  flag: "Tuple30K"
  refresh_rate: 0.005

eval:
  lambda: [1.889e-03, 4.394e+00, 2.605e+02]
  expected_max_latency: 4
  expected_max_energy: 300


training:
  num_epochs: 400          # Number of generations
  pop_size: 190            # Population size
  mutation_sigma: null     # Gaussian noise std per layer: null = auto (He std = sqrt(2/fan_in))
  early_stop_patience: 100 # Generations without improvement before stopping
  # Max allowed value per objective [ttr, latency, energy] — null disables the constraint
  min_scores: [0.17, 25., 375.]


model:
  d_model: 128
  n_layers: 2
  # obs_type: ["cpu"]
  obs_type: ["cpu", "bw", "buffer"]
