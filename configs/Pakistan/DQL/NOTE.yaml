
policy: "NOTE"
algo: "TaskFormer"

env:
  dataset: "Pakistan"
  flag: "Tuple30K"
  refresh_rate: 0.005

eval:
  lambda: [1.889e-01, 4.394e+00, 2.605e+02]
  expected_max_latency: 4
  expected_max_energy: 300

training:
  num_epochs: 40
  learning_starts: 5000    # random steps before learning begins
  buffer_size: 50000      # max replay buffer size
  batch_size: 512          # samples per update
  target_update_freq: 1024 # steps between target network syncs
  update_freq: 8          # steps between policy updates
  lr: 1.e-4
  lr_decay: 1
  gamma: 0.99
  epsilon: 1
  epsilon_decay: 0.5
  reward_scale: 1
  lambda: [0.5, 0.5, 0.0]
  early_stop_patience: 40 # Early stopping patience (generations without improvement)
  disp_progress: True
  log_freq: 200

model:
  d_model: 64
  n_layers: 2
  n_heads: 2
  mlp_ratio: 4
  dropout: 0.1
  mode: node
  obs_type: ["cpu", "bw", "buffer"]


    