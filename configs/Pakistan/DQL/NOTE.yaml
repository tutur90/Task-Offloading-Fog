
policy: "NOTE"
algo: "TaskFormer"

env:
  dataset: "Pakistan"
  flag: "Tuple30K"
  refresh_rate: 0.005

eval:
  lambda: [5.294, 0.2276, 0.002952]
  expected_max_latency: 4
  expected_max_energy: 300

training:
  num_epochs: 30
  learning_starts: 5000    # random steps before learning begins
  buffer_size: 50000      # max replay buffer size
  batch_size: 64          # samples per update
  target_update_freq: 1024 # steps between target network syncs
  update_freq: 1          # steps between policy updates
  lr: 3.e-4
  lr_decay: 1
  gamma: 0.99
  epsilon: 1
  epsilon_decay: 0.3
  reward_scale: 1
  lambda: [0.8, 0.1, 0.1]
  early_stop_patience: 20 # Early stopping patience (generations without improvement)
  disp_progress: True

model:
  d_model: 64
  n_layers: 3
  n_heads: 4
  mlp_ratio: 4
  dropout: 0
  mode: node
  obs_type: ["cpu", "bw", "buffer"]


    