
policy: "NOTE"
algo: "TaskFormer"

env:
  dataset: "Pakistan"
  flag: "Tuple30K"
  refresh_rate: 0.005

eval:
  lambda: [5.294, 0.2276, 0.002952]
  expected_max_latency: 4
  expected_max_energy: 300

training:
  num_epochs: 20
  buffer_size: 10000      # max replay buffer size
  batch_size: 512          # samples per update
  target_update_freq: 10 # steps between target network syncs
  update_freq: 100
  lr: 0.005
  lr_decay: 0.95
  gamma: 0.9
  epsilon: 0.2
  epsilon_decay: 0.9
  beta: 0.5
  beta_decay: 0.9
  reward_scale: 1
  lambda: [0.8, 0.1, 0.1]

model:
  d_model: 64
  n_layers: 6
  n_heads: 4
  mlp_ratio: 4
  dropout: 0.2
  mode: node
  obs_type: ["cpu", "bw", "buffer"]


    