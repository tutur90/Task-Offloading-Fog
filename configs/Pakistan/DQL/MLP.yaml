
policy: "MLP"
algo: "DQL"

seed: 42

env:
  dataset: "Pakistan"
  flag: "Tuple30K"
  refresh_rate: 0.005

eval:
  lambda: [5.2941176470586, 0.22760484532528744, 0.0038384767437279347]
  expected_max_latency: 4
  expected_max_energy: 300

training:
  num_epochs: 30
  buffer_size: 10000      # max replay buffer size
  batch_size: 512          # samples per update
  target_update_freq: 32 # steps between target network syncs
  update_freq: 128          # steps between policy updates
  lr: 0.005
  lr_decay: 0.95
  gamma: 0.99
  epsilon: 0.2
  epsilon_decay: 0.9
  reward_scale: 1
  lambda: [0.8, 0.1, 0.1]
  early_stop_patience: 10 # Early stopping patience (generations without improvement)

model:
  d_model: 256
  n_layers: 3
  # obs_type: ["cpu"]
  # obs_type: ["cpu", "buffer"]
  obs_type: ["cpu", "bw", "buffer"]
  bias: true
  dropout: 0

