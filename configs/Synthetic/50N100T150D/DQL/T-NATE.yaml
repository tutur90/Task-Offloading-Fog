
policy: "T-NATE"
algo: "DQL"

seed: 0

env:
  dataset: "Synthetic"
  flag: "50N100T150D"
  refresh_rate: 0.005


algo: DQL
eval:
    lambda: [0.001889, 4.394, 260.5]

training:
    num_epochs: 40
    learning_starts: 5000
    warmup: 0.1
    buffer_size: 100000
    batch_size: 128
    target_update_freq: 2000
    update_freq: 4
    lr: 5.0e-06
    ref_d_model: 64
    ref_n_layers: 1
    lr_decay: 1
    gamma: 0.99
    exploration: {'strategy': 'ucb', 'explore_value': 0.3}
    reward: {'momentum': 0.999, 'norm': 'standard', 'scale': 1, 'eps': 0.1, 'clip': 5.0, 'storage_norm': True, log1p: True}
    optimizer: {'type': 'RMSprop', 'weight_decay': 0.0}
    lambda: [0.350, 0.35, 0.3]
    early_stop_patience: 20
    log_freq: 0
    # clip_grad_norm: 0.5

model:
    d_model: 256
    n_layers: 2
    n_heads: 16
    mlp_ratio: 4
    dropout: 0.0
    obs_type: ['cpu', 'bw', 'buffer', 'task']
    qk_norm: True
    embed: regular
    pre_conditioning: add
    per_layer_conditioning: none
    n_prefix: 4

