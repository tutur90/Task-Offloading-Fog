policy: "T-MLP"
algo: "DQL"

seed: 42

env:
  dataset: "Synthetic"
  flag: "50N100T150D"
  refresh_rate: 0.005

eval:
  lambda: [1.889e-03, 4.394e+00, 2.605e+02]
  expected_values: [0.2, 4.0, 300.0]


training:
  num_epochs: 50
  learning_starts: 5000    # random steps before learning begins
  warmup: 0                # LR warmup as ratio of total training steps
  buffer_size: 50000      # max replay buffer size
  batch_size: 512          # samples per update
  target_update_freq: 2000  # >= 1 → hard copy every N grad steps | < 1 → soft update with τ = value
  update_freq: 8          # steps between policy updates
  lr: 5.e-6
  lr_decay: 1
  gamma: 0.9
  # Exploration strategy: "epsilon_greedy" (default), "boltzmann", or "ucb"
  exploration:
    strategy: "ucb"
    explore_value: 0.2
  reward:
    momentum: 0.999
    norm: "log1p_standard"  # "none", "mean", "ln_mean", "standard", "ln_standard"
    scale: 1
    eps: 1.e-2

  optimizer:
    type: "RMSprop"
    # weight_decay: 0
    
  lambda: [0.50000,0.300000,0.200000]
  early_stop_patience: 30 # Early stopping patience (generations without improvement)
  log_freq: 0      # Steps between logging training metrics

model:
  d_model: 512
  n_layers: 2
  # obs_type: ["cpu"]
  # obs_type: ["cpu", "buffer"]
  obs_type: ["cpu", "bw", "buffer", "task"]
  bias: true
  dropout: 0

